<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout — Ultrawider Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a href="/" class="logo">
          <span class="logo-mark"></span>
          <span class="logo-text">Ultrawider</span>
        </a>
        <nav class="nav-links">
          <a href="/pricing" class="btn btn-ghost btn-sm">View plans</a>
        </nav>
      </div>
    </header>

    <main class="checkout-page">
      <div class="container container-narrow">
        <a href="/pricing" class="back">← Back to plans</a>

        <div class="summary" id="summary"></div>

        <form id="checkout-form">
          <label for="email">Where should we send your license key?</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="your.email@example.com"
            autocomplete="email"
          />
          <p class="hint">
            We'll email your activation key here within 5–20 minutes after
            payment is confirmed.
          </p>

          <button type="submit" id="submit-btn">Continue to payment →</button>

          <p class="legal">
            By continuing, you agree to our
            <a href="/terms.html">Terms</a> and
            <a href="/refund.html">Refund Policy</a>.
          </p>
        </form>

        <div id="error" class="error" hidden></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-bottom">
        <span>© 2026 Ultrawider · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · <a href="/refund.html">Refund</a></span>
      </div>
    </footer>

    <script src="/assets/config.js"></script>
    <script src="/assets/checkout.js"></script>
  </body>
</html>
